<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test B2B Button</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <h2>اختبار زر الحقول الإضافية B2B</h2>
    
    <div class="mb-3">
        <label>اختر العميل:</label>
        <select id="party_id" class="form-control">
            <option value="">اختر عميل</option>
            <option value="1" data-zatca-type="b2c">عميل B2C</option>
            <option value="28" data-zatca-type="b2b">شركة المستقبل للتجارة (B2B)</option>
        </select>
    </div>
    
    <div class="b2b-fields-wrapper d-none" id="b2b-fields-wrapper">
        <button type="button" class="btn btn-primary">
            ✅ B2B Additional Fields
        </button>
    </div>
    
    <div class="mt-3">
        <h4>Console Log:</h4>
        <div id="log" class="border p-3" style="min-height: 100px; background: #f5f5f5;"></div>
    </div>
    
    <script>
        const log = document.getElementById('log');
        
        function addLog(message) {
            log.innerHTML += message + '<br>';
            console.log(message);
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            addLog('✅ DOM Loaded');
            
            const partySelect = document.getElementById('party_id');
            const b2bFieldsWrapper = document.getElementById('b2b-fields-wrapper');
            
            if (!partySelect) {
                addLog('❌ party_id not found!');
                return;
            }
            
            if (!b2bFieldsWrapper) {
                addLog('❌ b2b-fields-wrapper not found!');
                return;
            }
            
            addLog('✅ Elements found');
            
            partySelect.addEventListener('change', function() {
                addLog('🔄 Party changed');
                
                const selectedOption = this.options[this.selectedIndex];
                const zatcaType = selectedOption.getAttribute('data-zatca-type');
                
                addLog('Selected: ' + selectedOption.text);
                addLog('ZATCA Type: ' + zatcaType);
                
                if (zatcaType === 'b2b') {
                    b2bFieldsWrapper.classList.remove('d-none');
                    addLog('✅ Button shown (B2B)');
                } else {
                    b2bFieldsWrapper.classList.add('d-none');
                    addLog('❌ Button hidden (B2C)');
                }
            });
            
            addLog('✅ Event listener attached');
        });
    </script>
</body>
</html>
